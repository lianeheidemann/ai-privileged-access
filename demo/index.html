<!doctype html>
<!-- Prévia estática e interativa do DataGuard AI. Sem dados reais, backend ou serviços externos. -->
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataGuard AI · Demonstração</title><style>
:root{font-family:system-ui,Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b141d;color:#eaf2f7}body.light{background:#f5f8fa;color:#1b3344;color-scheme:light}button,select,input{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid #32414b;padding:16px 20px;position:sticky;top:0;background:inherit;z-index:2}header strong{flex:1}button{border:1px solid #456071;border-radius:9px;padding:10px 13px;background:#19303f;color:inherit}.light button{background:#e1edf4}main{max-width:1100px;margin:auto;padding:25px 20px 70px}.eyebrow{color:#88b3ca;font-size:11px;letter-spacing:2px;font-weight:700}h1{font-size:32px;margin:9px 0}p{line-height:1.6;color:#9aafbe}.light p{color:#506d7e}.panel,.tile{background:#14222e;border:1px solid #304451;border-radius:14px;padding:22px}.light .panel,.light .tile{background:white;border-color:#d3e0e8}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.tile small{display:block;color:#9ab1bf;margin-bottom:12px}.tile strong{font-size:27px}.nav{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0 25px}.nav button.active{background:#43728d;border-color:#7cb5d3}.light .nav button.active{background:#b9d9ea}.bar{height:14px;border-radius:12px;background:#2b3d49;overflow:hidden;margin:8px 0 18px}.fill{height:100%;background:#8bbbd5;border-radius:12px}.chart-row{display:grid;grid-template-columns:110px 1fr 60px;align-items:center;gap:12px;font-size:13px}.line-chart{width:100%;height:180px}.line-chart polyline{fill:none;stroke:#8bbbd5;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.table{width:100%;border-collapse:collapse;font-size:13px}.table td,.table th{text-align:left;padding:12px;border-bottom:1px solid #32414b}.table-wrap{overflow-x:auto}.panel+.panel{margin-top:16px}input,select{padding:12px;background:#1c3040;border:1px solid #4a6575;color:inherit;border-radius:8px;max-width:100%}.light input,.light select{background:#edf4f8}#screen{min-height:250px}.muted{font-size:12px;color:#9ab1bf}.hidden{display:none}@media(max-width:600px){.tiles{grid-template-columns:1fr}.chart-row{grid-template-columns:88px 1fr 45px;font-size:11px}header{padding:12px}main{padding:20px 14px}h1{font-size:26px}.panel{padding:17px}}
</style></head><body><header><strong>◈ DataGuard AI</strong><span class="muted">PREVIEW</span><button id="theme" aria-label="Alternar tema">☀ / ☾</button></header><main><div class="eyebrow">PRIVATE DATA WORKSPACE / DEMONSTRAÇÃO</div><h1 id="title">Visão geral</h1><p>Protótipo navegável para avaliar a experiência visual. Dados e respostas são fictícios.</p><nav class="nav" id="nav"></nav><div id="screen"></div><p class="muted">Prévia offline. Não há IA conectada, autenticação, API ou acesso a informações empresariais.</p></main><script>
const names=['Visão geral','Fontes de dados','Consultas','Análises','Assistente','Relatórios','Configurações'];let page=0;const sources=[['Equipamentos','750'],['Movimentações','2.095'],['Chamados','1.196'],['Responsáveis','90'],['Setores','18'],['Categorias','12']];const chart=[['Em uso',420],['Disponíveis',195],['Manutenção',90],['Outros',45]];function table(rows,head){return '<div class="table-wrap"><table class="table"><thead><tr>'+head.map(v=>'<th>'+v+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}function cards(){return '<div class="tiles">'+[['Fontes sintéticas','6'],['Registros de referência','4.161'],['Ambiente','Offline']].map(x=>'<div class="tile"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</div>'}function bars(){return chart.map(([name,n])=>'<div class="chart-row"><span>'+name+'</span><div class="bar"><div class="fill" style="width:'+(n/420*100)+'%"></div></div><strong>'+n+'</strong></div>').join('')}function render(){document.getElementById('title').textContent=names[page];document.getElementById('nav').innerHTML=names.map((name,i)=>'<button class="'+(page===i?'active':'')+'" data-page="'+i+'">'+name+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=+b.dataset.page;render()});const s=document.getElementById('screen');if(page===0)s.innerHTML=cards()+'<div class="panel"><h2>Informações mais acessíveis. Decisões mais simples.</h2><p>Explore as sete interfaces demonstrativas pelo menu acima.</p><button id="go">Explorar análises →</button></div>';if(page===1)s.innerHTML='<div class="panel"><h2>Catálogo de fontes</h2>'+table(sources,['Conjunto sintético','Registros'])+'</div>';if(page===2)s.innerHTML='<div class="panel"><h2>Consulta demonstrativa</h2><p>Selecione um conjunto para visualizar sua quantidade de registros.</p><select id="src">'+sources.map(x=>'<option>'+x[0]+'</option>').join('')+'</select> <button id="query">Executar</button><p id="answer"></p></div>';if(page===3)s.innerHTML=cards()+'<div class="panel"><h2>Equipamentos por situação</h2><p>Gráfico de barras · valores ilustrativos</p>'+bars()+'</div><div class="panel"><h2>Evolução de chamados</h2><p>Gráfico de linhas · dados ilustrativos</p><svg class="line-chart" viewBox="0 0 600 180" role="img" aria-label="Evolução fictícia de chamados"><path d="M0 160H600" stroke="#506477"/><polyline points="15,125 125,90 235,112 345,50 455,72 580,25"/></svg><div class="muted">Maio · Junho · Julho · Agosto · Setembro · Outubro</div></div><div class="panel"><h2>Composição percentual</h2><p>Distribuição ilustrativa</p>'+chart.map(([n,v])=>'<p>'+n+': '+(v/750*100).toFixed(1).replace('.',',')+'%</p>').join('')+'</div>';if(page===4)s.innerHTML='<div class="panel"><h2>Assistente privado</h2><p>As respostas abaixo são predefinidas; nenhuma IA está em execução.</p><input id="question" placeholder="Digite sua pergunta" aria-label="Pergunta"> <button id="ask">Enviar</button><p id="reply"></p></div>';if(page===5)s.innerHTML='<div class="panel"><h2>Relatório demonstrativo</h2><p>Dados ilustrativos para visualização.</p>'+table([['Notebook','Tecnologia','Em uso'],['Monitor','Administração','Disponível'],['Projetor','Educação','Manutenção']],['Item','Setor','Situação'])+'<button id="csv">Exportar CSV</button></div>';if(page===6)s.innerHTML='<div class="panel"><h2>Preferências de visualização</h2><p>Use o botão no cabeçalho para alternar o tema.</p><p>Versão: demonstração estática · Processamento: local no navegador · API: não conectada.</p></div>';if(page===0)document.getElementById('go').onclick=()=>{page=3;render()};if(page===2)document.getElementById('query').onclick=()=>{let x=sources.find(v=>v[0]===document.getElementById('src').value);document.getElementById('answer').textContent=x[0]+': '+x[1]+' registros sintéticos (referência estática).'};if(page===4)document.getElementById('ask').onclick=()=>{document.getElementById('reply').textContent='Demonstração: a futura IA local poderá responder a consultas autorizadas. Nenhum modelo está conectado nesta prévia.'};if(page===5)document.getElementById('csv').onclick=()=>{const content='Item;Setor;Situação\nNotebook;Tecnologia;Em uso\nMonitor;Administração;Disponível\nProjetor;Educação;Manutenção';const a=document.createElement('a');const u=URL.createObjectURL(new Blob(['\uFEFF'+content],{type:'text/csv;charset=utf-8'}));a.href=u;a.download='dataguard-demo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}}document.getElementById('theme').onclick=()=>document.body.classList.toggle('light');render();
</script></body></html>
