<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-label="Roadmap do DataGuard AI: trilha principal das etapas 02 a 07 e trilha complementar das etapas 08 a 10. A etapa 07 é uma implantação posterior.">
<style>
:root{--ink:#243449;--muted:#64748b;--line:#a1afbd;--edge:#cbd5e1;--fill:#f8fafc;--accent:#315f7d;--accentfill:#e9f1f7}
@media(prefers-color-scheme:dark){:root{--ink:#e6eef6;--muted:#9fb0c1;--line:#718599;--edge:#405466;--fill:#182632;--accent:#a5c9df;--accentfill:#213849}}
.box{fill:var(--fill);stroke:var(--edge);stroke-width:1.5}
.focus{fill:var(--accentfill);stroke:var(--accent);stroke-width:1.5}
.ink{fill:var(--ink)}.muted{fill:var(--muted)}
.line{stroke:var(--line);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke:var(--line);stroke-width:1.8;fill:none;stroke-dasharray:6 6;stroke-linecap:round;stroke-linejoin:round}
.title{font:600 30px system-ui,Segoe UI,sans-serif}
.head{font:600 18px system-ui,Segoe UI,sans-serif}
.sub{font:400 13px system-ui,Segoe UI,sans-serif}
.small{font:500 12px system-ui,Segoe UI,sans-serif;letter-spacing:.6px}
</style>
