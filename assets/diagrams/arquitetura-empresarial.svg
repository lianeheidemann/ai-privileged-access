<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="Arquitetura empresarial planejada do DataGuard AI: usuários autorizados, interface React, API FastAPI, Ollama local, conectores de leitura, banco corporativo e controles de segurança. SVG transparente adaptável ao tema claro ou escuro."><style>:root{--ink:#243449;--muted:#64748b;--line:#a1afbd;--edge:#cbd5e1;--fill:#f8fafc;--accent:#315f7d;--accentfill:#e9f1f7}@media(prefers-color-scheme:dark){:root{--ink:#e6eef6;--muted:#9fb0c1;--line:#718599;--edge:#405466;--fill:#182632;--accent:#a5c9df;--accentfill:#213849}}.box{fill:var(--fill);stroke:var(--edge);stroke-width:1.5}.focus{fill:var(--accentfill);stroke:var(--accent);stroke-width:1.5}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.line{stroke:var(--line);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:var(--line);stroke-width:1.5;fill:none;stroke-dasharray:6 6}.title{font:600 30px system-ui,Segoe UI,sans-serif}.head{font:600 20px system-ui,Segoe UI,sans-serif}.sub{font:400 15px system-ui,Segoe UI,sans-serif}.small{font:500 13px system-ui,Segoe UI,sans-serif;letter-spacing:.6px}</style><text x="36" y="54" class="ink title" text-anchor="start">ARQUITETURA EMPRESARIAL</text><text x="1064" y="52" class="muted small" text-anchor="end">PROPOSTA · REDE INTERNA</text><rect x="25" y="88" width="1050" height="418" rx="16" class="dash"/><text x="42" y="113" class="muted small" text-anchor="start">AMBIENTE CORPORATIVO CONTROLADO</text><rect x="42" y="143" width="305" height="98" rx="12" class="box"/><text x="62" y="179" class="ink head" text-anchor="start">Usuários autorizados</text><text x="62" y="206" class="muted sub" text-anchor="start">Navegador · perfis de acesso</text><rect x="398" y="143" width="305" height="98" rx="12" class="focus"/><text x="418" y="179" class="ink head" text-anchor="start">React + FastAPI</text><text x="418" y="206" class="muted sub" text-anchor="start">Interface · API interna</text><rect x="754" y="143" width="305" height="98" rx="12" class="box"/><text x="774" y="179" class="ink head" text-anchor="start">Ollama local</text><text x="774" y="206" class="muted sub" text-anchor="start">Inferência sem API externa</text><path d="M347 192 H398 M703 192 H754" class="line"/><path d="M550 241 V288 H194 V324 M550 288 H550 V324 M550 288 H906 V324" class="line"/><rect x="42" y="324" width="305" height="98" rx="12" class="box"/><text x="62" y="360" class="ink head" text-anchor="start">Conectores de dados</text><text x="62" y="387" class="muted sub" text-anchor="start">Consultas somente leitura</text><rect x="398" y="324" width="305" height="98" rx="12" class="box"/><text x="418" y="360" class="ink head" text-anchor="start">Autorização e filtros</text><text x="418" y="387" class="muted sub" text-anchor="start">Permissões · dados mínimos</text><rect x="754" y="324" width="305" height="98" rx="12" class="box"/><text x="774" y="360" class="ink head" text-anchor="start">Auditoria e segurança</text><text x="774" y="387" class="muted sub" text-anchor="start">Registros · regras de saída</text><path d="M194 422 V469 H398" class="line"/><rect x="398" y="446" width="305" height="46" rx="10" class="box"/><text x="550" y="475" class="ink sub" text-anchor="middle">Banco corporativo · fonte preservada</text><text x="42" y="546" class="ink small" text-anchor="start">CONEXÕES EXTERNAS BLOQUEADAS POR PADRÃO</text><text x="42" y="576" class="muted sub" text-anchor="start">Regras de firewall, isolamento, autenticação e testes de tráfego serão validados na etapa 07.</text></svg>