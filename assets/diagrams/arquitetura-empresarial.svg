<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="Arquitetura empresarial planejada: usuários autorizados na intranet, controle de acesso, FastAPI, Ollama local, conectores de leitura para banco corporativo, auditoria e firewall bloqueando saída externa. Fundo transparente e adaptação a temas claro e escuro."><style>:root{--ink:#263747;--muted:#64748b;--line:#8ca0b2;--stroke:#c3d0db;--surface:#f5f8fa;--focus:#e7f0f6;--accent:#3a6581;--warn:#a85c4c}@media(prefers-color-scheme:dark){:root{--ink:#e6eef6;--muted:#9bafbf;--line:#7f95a8;--stroke:#405565;--surface:#172530;--focus:#233949;--accent:#a5c9df;--warn:#d8a69a}}.panel{fill:var(--surface);stroke:var(--stroke);stroke-width:1.4}.focus{fill:var(--focus);stroke:var(--accent);stroke-width:1.6}.outline{fill:none;stroke:var(--stroke);stroke-width:1.5;stroke-dasharray:6 6}.line{fill:none;stroke:var(--line);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.warn{fill:var(--warn)}.title{font:600 29px system-ui,'Segoe UI',sans-serif}.head{font:600 18px system-ui,'Segoe UI',sans-serif}.body{font:400 14px system-ui,'Segoe UI',sans-serif}.small{font:500 12px system-ui,'Segoe UI',sans-serif;letter-spacing:.4px}</style><text x="38" y="52" class="ink title" text-anchor="start">ARQUITETURA EMPRESARIAL</text><text x="1162" y="50" class="muted small" text-anchor="end">PROPOSTA · NÃO IMPLEMENTADA</text><rect x="30" y="83" width="1140" height="487" rx="18" class="outline"/><text x="52" y="109" class="muted small" text-anchor="start">INFRAESTRUTURA CONTROLADA DA EMPRESA</text><rect x="52" y="144" width="262" height="86" rx="10" class="panel"/><text x="69" y="175" class="ink head" text-anchor="start">Usuários autorizados</text><text x="69" y="200" class="muted body" text-anchor="start">Navegador na intranet</text><rect x="358" y="144" width="275" height="86" rx="10" class="focus"/><text x="375" y="175" class="ink head" text-anchor="start">Controle de acesso</text><text x="375" y="200" class="muted body" text-anchor="start">Identidade · perfis · TLS</text><rect x="679" y="144" width="440" height="86" rx="10" class="focus"/><text x="696" y="175" class="ink head" text-anchor="start">Interface e API internas</text><text x="696" y="200" class="muted body" text-anchor="start">React · FastAPI · políticas de consulta</text><path d="M314 187 H358 M633 187 H679" class="line"/><path d="M899 230 V275 H259 V320 M899 275 H600 V320 M899 275 H942 V320" class="line"/><rect x="52" y="320" width="413" height="91" rx="10" class="panel"/><text x="69" y="351" class="ink head" text-anchor="start">Conector de dados</text><text x="69" y="376" class="muted body" text-anchor="start">Somente leitura · consultas permitidas</text><rect x="501" y="320" width="288" height="91" rx="10" class="panel"/><text x="518" y="351" class="ink head" text-anchor="start">Inferência privada</text><text x="518" y="376" class="muted body" text-anchor="start">Ollama · modelo interno</text><rect x="825" y="320" width="294" height="91" rx="10" class="panel"/><text x="842" y="351" class="ink head" text-anchor="start">Auditoria e segurança</text><text x="842" y="376" class="muted body" text-anchor="start">Logs mínimos · alertas</text><path d="M259 411 V452" class="line"/><rect x="52" y="452" width="413" height="86" rx="10" class="focus"/><text x="69" y="483" class="ink head" text-anchor="start">Banco corporativo</text><text x="69" y="508" class="muted body" text-anchor="start">Origem preservada · permissões mínimas</text><text x="600" y="472" class="warn head" text-anchor="start">Sem APIs externas de IA</text><text x="600" y="498" class="muted body" text-anchor="start">Saída bloqueada por padrão</text><text x="600" y="522" class="muted body" text-anchor="start">Exceções aprovadas e auditadas</text><path d="M52 596 H1148" class="line"/><text x="52" y="623" class="muted body" text-anchor="start">Fluxos internos autorizados; autenticação, segmentação e inspeção de tráfego devem ser testadas.</text><text x="52" y="646" class="muted body" text-anchor="start">O diagrama representa requisitos propostos, não garantias de ausência de vazamentos.</text></svg>