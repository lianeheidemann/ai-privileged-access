<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-label="Protótipo local de validação do AI Privileged Access, com banco SQLite sintético, serviços internos e Ollama; implantação corporativa com conectores autorizados é futura."><style>:root{--ink:#243449;--muted:#64748b;--line:#a1afbd;--edge:#cbd5e1;--fill:#f8fafc;--accent:#315f7d;--accentfill:#e9f1f7}@media(prefers-color-scheme:dark){:root{--ink:#e6eef6;--muted:#9fb0c1;--line:#718599;--edge:#405466;--fill:#182632;--accent:#a5c9df;--accentfill:#213849}}.box{fill:var(--fill);stroke:var(--edge);stroke-width:1.5}.focus{fill:var(--accentfill);stroke:var(--accent);stroke-width:1.5}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.line{stroke:var(--line);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.title{font:600 30px system-ui,Segoe UI,sans-serif}.head{font:600 20px system-ui,Segoe UI,sans-serif}.sub{font:400 15px system-ui,Segoe UI,sans-serif}.small{font:500 13px system-ui,Segoe UI,sans-serif;letter-spacing:.6px}</style><text x="36" y="54" class="ink title" text-anchor="start">PROTÓTIPO LOCAL</text><text x="1064" y="52" class="muted small" text-anchor="end">VALIDAÇÃO · OFFLINE</text><rect x="36" y="108" width="300" height="100" rx="12" class="box"/><text x="56" y="144" class="ink head" text-anchor="start">Navegador</text><text x="56" y="170" class="muted sub" text-anchor="start">127.0.0.1</text><rect x="400" y="108" width="300" height="100" rx="12" class="box"/><text x="420" y="144" class="ink head" text-anchor="start">React + TypeScript</text><text x="420" y="170" class="muted sub" text-anchor="start">Vite no desenvolvimento</text><rect x="764" y="108" width="300" height="100" rx="12" class="focus"/><text x="784" y="144" class="ink head" text-anchor="start">Python + FastAPI</text><text x="784" y="170" class="muted sub" text-anchor="start">API local · porta 8000</text><path d="M336 158 H400 M700 158 H764" class="line"/><path d="M914 208 V263 H186 V305 M550 263 V305 M914 263 V305" class="line"/><rect x="36" y="305" width="300" height="100" rx="12" class="box"/><text x="56" y="341" class="ink head" text-anchor="start">SQLite sintético</text><text x="56" y="367" class="muted sub" text-anchor="start">Dados fictícios · sem porta TCP</text><rect x="400" y="305" width="300" height="100" rx="12" class="box"/><text x="420" y="341" class="ink head" text-anchor="start">Ollama</text><text x="420" y="367" class="muted sub" text-anchor="start">IA local · porta 11434</text><rect x="764" y="305" width="300" height="100" rx="12" class="box"/><text x="784" y="341" class="ink head" text-anchor="start">Serviços Python</text><text x="784" y="367" class="muted sub" text-anchor="start">Papéis · catálogo · auditoria</text><path d="M36 451 H1064" class="line"/><text x="36" y="480" class="muted sub" text-anchor="start">Protótipo planejado · Serviços em loopback · Sem inferência externa</text></svg>